<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Listas</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-body-tertiary">

  <div class="container-fluid p-3">
    <div class="row g-3 app-shell">

      <!-- ===== Banner: marca + navegación entre listas (Navbar en vertical) ===== -->
      <header class="col-12 col-lg-3">
        <nav class="navbar bg-body border rounded-3 h-100 p-3 p-lg-4 flex-column flex-nowrap align-items-stretch"
             aria-label="Navegación de listas">

          <span class="navbar-brand franja-encabezado fs-4 fw-bold w-100 mx-0 d-flex align-items-center justify-content-center border-bottom pb-3 mb-3">LISTAPP</span>

          <h2 id="titulo-mis-listas" class="small fw-semibold text-uppercase text-body-secondary mb-2">Mis Listas</h2>

          <!-- Barra "Seleccionar todos / Eliminar": la arma js/app.js solo
               en modo "Seleccionar". -->
          <div id="barra-seleccion-listas" class="mb-2 d-none"></div>

          <!-- Las listas las inyecta js/app.js: cada una es un
               <button class="list-group-item list-group-item-action ...">.
               flex-grow-1 + overflow-y-auto -> ocupa el espacio libre y
               scrollea por dentro cuando hay muchas (el min-height: 0 va
               en styles.css). -->
          <div id="listas-sidebar" class="list-group gap-2 w-100 flex-grow-1 overflow-y-auto"></div>

          <!-- Crear lista: fuera del área que scrollea, siempre fijo al fondo.
               El mt-3 lo separa del list-group (ya no hace falta mt-auto:
               el flex-grow-1 de #listas-sidebar empuja este form abajo). -->
          <form id="form-nueva-lista" class="w-100 mt-3 d-flex flex-column gap-2">
            <label for="entrada-nueva-lista" class="form-label mb-0">Nombre de tu lista</label>
            <input type="text" id="entrada-nueva-lista" class="form-control" autocomplete="off">
            <!-- El texto del error lo pone js/app.js; Bootstrap lo muestra
                 solo cuando el input tiene la clase .is-invalid -->
            <p id="error-nueva-lista" class="invalid-feedback mb-0"></p>
            <button type="submit" id="btn-crear-lista" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
              <img src="images/add.svg" alt="" width="20" height="20">
              Crear Lista
            </button>
          </form>
        </nav>
      </header>

      <!-- ===== Panel principal: tareas de la lista activa ===== -->
      <main class="col-12 col-lg-9">
        <div class="p-3 p-lg-4">

          <!-- Encabezado -->
          <header class="franja-encabezado d-flex justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
            <div>
              <!-- Título y fecha los completa js/app.js según la lista activa -->
              <h1 class="h4 fw-bold mb-1" id="titulo-lista-actual">Mis Listas</h1>
              <p class="small text-body-secondary mb-0" id="fecha-actual"></p>
            </div>

            <!-- Controles de la app:-->
            <div class="d-flex flex-wrap gap-2" role="toolbar" aria-label="Controles de la aplicación">
              <button id="btn-seleccionar-listas" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Seleccionar listas">
                <img src="images/check_box_outline_blank.svg" alt="" width="20" height="20">
                Seleccionar
              </button>
              <button id="btn-editar-listas" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Editar listas">
                <img src="images/edit.svg" alt="" width="20" height="20">
                Editar
              </button>
              <button id="btn-tema" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Cambiar tema">
                <img src="images/mode_night.svg" alt="" width="20" height="20">
                <span id="texto-tema">Oscuro</span>
              </button>
            </div>
          </header>

          <!-- Filtros: componente Nav de Bootstrap (nav-pills).
               nav-justified  -> las tres del mismo ancho.
               flex-column flex-md-row -> mobile: una abajo de la otra;
                                          desktop (md+): en fila. -->
          <div class="bg-body border rounded-3 p-2 mb-4">
            <ul class="nav nav-pills nav-justified flex-column flex-md-row gap-2" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link tab active py-2 d-flex align-items-center justify-content-center gap-2"
                        type="button" data-filter="all" role="tab" aria-selected="true">
                  Todas <span id="count-all" class="badge rounded-pill text-bg-secondary">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link tab py-2 d-flex align-items-center justify-content-center gap-2"
                        type="button" data-filter="pending" role="tab" aria-selected="false">
                  Pendientes <span id="count-pending" class="badge rounded-pill text-bg-secondary">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link tab py-2 d-flex align-items-center justify-content-center gap-2"
                        type="button" data-filter="completed" role="tab" aria-selected="false">
                  Completadas <span id="count-completed" class="badge rounded-pill text-bg-secondary">0</span>
                </button>
              </li>
            </ul>
          </div>

          <!-- El form de agregar tarea lo arma js/app.js acá dentro y solo
               aparece cuando hay al menos una lista. -->
          <div id="contenedor-form-tarea"></div>

          <!-- Estado sin listas: visible por defecto; js/app.js lo oculta
               (d-none) en cuanto existe al menos una lista -->
          <p id="estado-sin-listas" class="text-center text-body-secondary py-5">
            No tenés listas creadas aún...
          </p>

          <!-- Barra "Seleccionar todos / Eliminar" de tareas: la arma
               js/app.js solo en modo "Seleccionar". -->
          <div id="barra-seleccion-tareas" class="mb-3 d-none"></div>

          <!-- Las tareas las inyecta js/app.js -->
          <ul id="lista-tareas" class="list-group gap-2"></ul>
          <p id="estado-vacio" class="text-center text-body-secondary py-5 d-none">No hay tareas para mostrar.</p>

        </div>
      </main>

    </div>
  </div>

  <!-- Contenedor de avisos (toasts). El texto lo pone js/app.js. -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast-aviso" class="toast text-bg-secondary border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div id="toast-aviso-texto" class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación para borrados masivos. El texto y el onConfirmar
       los setea js/app.js. -->
  <div class="modal fade" id="modal-confirmar" tabindex="-1" aria-hidden="true" aria-describedby="modal-confirmar-texto" aria-label="Confirmar eliminación">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body" id="modal-confirmar-texto"></div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" tabindex="-1">Cancelar</button>
          <button type="button" class="btn btn-danger d-flex align-items-center gap-2" id="modal-confirmar-ok" tabindex="-1">
            <img src="images/delete.svg" alt="" width="16" height="16">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/claro_oscuro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
