<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOIT</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./imagenes/iconos/icono-180.png">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-body-tertiary">
  <div class="container-fluid p-3">
    <div class="row g-3 contenedor-app">

      <!-- ===== Banner: marca + navegación entre listas (Navbar en vertical) ===== -->
      <header class="col-12 col-lg-3">
        <nav class="navbar bg-body border rounded-3 h-100 p-3 p-lg-4 flex-column flex-nowrap align-items-stretch"
             aria-label="Navegación de listas">

          <!-- Marca a la izquierda + botón de instalar la PWA a la derecha.
               js/app.js muestra el botón solo si la app se puede instalar. -->
          <div class="franja-encabezado d-flex align-items-center justify-content-between gap-2 border-bottom pb-3 mb-3">
            <h1 class="navbar-brand fs-4 fw-bold mx-0 my-0 py-0">DOIT</h1>
            <button id="instalador" type="button"
                    class="btn btn-primary btn-sm px-3 align-items-center gap-1" hidden>
              <svg class="icono-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16L7 11L8.4 9.55L11 12.15V4H13V12.15L15.6 9.55L17 11L12 16ZM6 20C5.45 20 4.97917 19.8042 4.5875 19.4125C4.19583 19.0208 4 18.55 4 18V15H6V18H18V15H20V18C20 18.55 19.8042 19.0208 19.4125 19.4125C19.0208 19.8042 18.55 20 18 20H6Z"/></svg>
              Instalar
            </button>
          </div>

          <!-- Título + selector propio de listas (independiente del de tareas). -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 id="titulo-mis-listas" class="small fw-semibold text-uppercase text-body mb-0">Mis Listas</h2>
            <button id="boton-seleccionar-listas" type="button"
                    class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1"
                    title="Seleccionar listas" aria-pressed="false">
              <svg class="icono-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21C4.45 21 3.97917 20.8042 3.5875 20.4125C3.19583 20.0208 3 19.55 3 19V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H19C19.55 3 20.0208 3.19583 20.4125 3.5875C20.8042 3.97917 21 4.45 21 5V19C21 19.55 20.8042 20.0208 20.4125 20.4125C20.0208 20.8042 19.55 21 19 21H5ZM5 19H19V5H5V19Z"/></svg>
              Seleccionar
            </button>
          </div>

          <!-- Barra "Seleccionar todas / Eliminar": la arma js/app.js solo
               en modo "Seleccionar listas". -->
          <div id="barra-seleccion-listas" class="mb-2 d-none"></div>

          <!-- Las listas las inyecta js/app.js: cada una es un <li>-->
          <ul id="listas-barra-lateral" class="list-group gap-2 w-100 flex-grow-1 overflow-y-auto"></ul>

          <!-- Crear lista -->
          <form id="formulario-nueva-lista" class="w-100 mt-3 d-flex flex-column gap-2">
            <label for="entrada-nueva-lista" class="form-label mb-0">Nombre de tu lista</label>
            <input type="text" id="entrada-nueva-lista" class="form-control" autocomplete="off">
            <!-- El texto del error lo pone js/app.js; -->
            <p id="error-nueva-lista" class="invalid-feedback mb-0"></p>
            <button type="submit" id="boton-crear-lista" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
              <svg class="icono-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21V13H3V11H11V3H13V11H21V13H13V21H11Z"/></svg>
              Crear Lista
            </button>
          </form>
        </nav>
      </header>

      <!-- ===== Panel principal: tareas de la lista activa ===== -->
      <main class="col-12 col-lg-9">
        <div class="p-3 p-lg-4">

          <!-- Encabezado -->
          <header class="franja-encabezado d-flex justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
            <!-- El título de la lista y la fecha los crea js/app.js -->
            <div id="encabezado-lista"></div>

            <!-- Controles de la app:-->
            <div class="d-flex flex-wrap gap-2" role="toolbar" aria-label="Controles de la aplicación">
              <button id="boton-seleccionar-tareas" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Seleccionar tareas" aria-pressed="false">
                <svg class="icono-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21C4.45 21 3.97917 20.8042 3.5875 20.4125C3.19583 20.0208 3 19.55 3 19V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H19C19.55 3 20.0208 3.19583 20.4125 3.5875C20.8042 3.97917 21 4.45 21 5V19C21 19.55 20.8042 20.0208 20.4125 20.4125C20.0208 20.8042 19.55 21 19 21H5ZM5 19H19V5H5V19Z"/></svg>
                Seleccionar
              </button>
              <button id="boton-editar-listas" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Editar listas">
                <svg class="icono-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19H6.425L16.2 9.225L14.775 7.8L5 17.575V19ZM3 21V16.75L16.2 3.575C16.4 3.39167 16.6208 3.25 16.8625 3.15C17.1042 3.05 17.3583 3 17.625 3C17.8917 3 18.15 3.05 18.4 3.15C18.65 3.25 18.8667 3.4 19.05 3.6L20.425 5C20.625 5.18333 20.7708 5.4 20.8625 5.65C20.9542 5.9 21 6.15 21 6.4C21 6.66667 20.9542 6.92083 20.8625 7.1625C20.7708 7.40417 20.625 7.625 20.425 7.825L7.25 21H3ZM15.475 8.525L14.775 7.8L16.2 9.225L15.475 8.525Z"/></svg>
                Editar
              </button>
              <button id="boton-notificar" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Notificaciones">
                <svg class="icono-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19v-2h2v-7q0-2.075 1.25-3.687T10.5 4.2v-.7q0-.625.438-1.062T12 2t1.063.438T13.5 3.5v.7q2 .5 3.25 2.113T18 10v7h2v2zm8 3q-.825 0-1.412-.587T10 20h4q0 .825-.587 1.413T12 22m-4-5h8v-7q0-1.65-1.175-2.825T12 6T9.175 7.175T8 10z"/></svg>
                Notificar
              </button>
              <!-- Desplegable: compartir la lista como texto o como archivo .txt -->
              <div class="dropdown">
                <button id="boton-compartir" type="button"
                        class="btn btn-outline-secondary d-flex align-items-center gap-2 dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false"
                        title="Compartir la lista activa">
                  <svg class="icono-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                  Compartir
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <button type="button" id="opcion-compartir-texto" class="dropdown-item d-flex align-items-center gap-2">
                      <i class="bi bi-chat-left-text" aria-hidden="true"></i> Como texto
                    </button>
                  </li>
                  <li>
                    <button type="button" id="opcion-compartir-archivo" class="dropdown-item d-flex align-items-center gap-2">
                      <i class="bi bi-file-earmark-text" aria-hidden="true"></i> Como archivo .txt
                    </button>
                  </li>
                </ul>
              </div>
              <button id="boton-tema" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Cambiar tema">
                <svg class="icono-lg" viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
                <span id="texto-tema">Oscuro</span>
              </button>
            </div>
          </header>

          <!-- Sección de tareas -->
          <section id="seccion-tareas" class="d-none">

            <!-- Filtros: componente Nav de Bootstrap-->
            <div class="bg-body border rounded-3 p-2 mb-4">
              <ul class="nav nav-pills nav-justified flex-column flex-md-row gap-2" role="tablist">
                <li class="nav-item" role="presentation">
                  <a class="nav-link pestana active py-2 d-flex align-items-center justify-content-center gap-2"
                          href="#" data-filtro="todas" role="tab" aria-selected="true">
                    Todas <span id="contador-todas" class="badge rounded-pill text-bg-secondary">0</span>
                  </a>
                </li>
                <li class="nav-item" role="presentation">
                  <a class="nav-link pestana py-2 d-flex align-items-center justify-content-center gap-2"
                          href="#" data-filtro="pendientes" role="tab" aria-selected="false">
                    Pendientes <span id="contador-pendientes" class="badge rounded-pill text-bg-secondary">0</span>
                  </a>
                </li>
                <li class="nav-item" role="presentation">
                  <a class="nav-link pestana py-2 d-flex align-items-center justify-content-center gap-2"
                          href="#" data-filtro="completadas" role="tab" aria-selected="false">
                    Completadas <span id="contador-completadas" class="badge rounded-pill text-bg-secondary">0</span>
                  </a>
                </li>
              </ul>
            </div>

            <!-- El form de agregar tarea lo arma js/app.js acá dentro. -->
            <div id="contenedor-formulario-tarea">
              <h4 class="h5 fw-semibold mb-3">Tus tareas</h4>
            </div>

            <!-- Barra "Seleccionar todas / Eliminar" de tareas: la arma
                 js/app.js solo en modo "Seleccionar tareas". -->
            <div id="barra-seleccion-tareas" class="mb-3 d-none"></div>

            <ul id="lista-tareas" class="list-group gap-2"></ul>
            <p id="estado-vacio" class="text-center text-body-secondary py-5 d-none">No hay tareas para mostrar.</p>
          </section>

          <!-- Estado sin listas: visible por defecto; js/app.js lo oculta
               (d-none) en cuanto existe al menos una lista -->
          <p id="estado-sin-listas" class="text-center text-body-secondary py-5">
            No tenés listas creadas aún...
          </p>

        </div>
      </main>

    </div>
  </div>

  <!-- Contenedor de avisos (toasts). El texto lo pone js/app.js.-->
  <div class="toast-container position-fixed bottom-0 start-0 w-100 p-3 d-flex flex-column align-items-center align-items-lg-end">
    <div id="notificacion-aviso" class="toast text-bg-secondary border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <p id="notificacion-aviso-texto" class="toast-body mb-0"></p>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>

    <!-- Toast de "tarea/lista eliminada" con opción de deshacer. Lo maneja js/app.js. -->
    <div id="notificacion-deshacer" class="toast bg-body shadow" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="5000">
      <div class="d-flex align-items-center gap-2 pe-2">
        <p id="notificacion-deshacer-texto" class="toast-body mb-0 flex-grow-1"></p>
        <button type="button" id="notificacion-deshacer-boton" class="btn btn-primary btn-sm fw-semibold text-light">Deshacer</button>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>

    <div id="notificaciones-permitidas" class="toast bg-body shadow" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
      <div class="d-flex">
        <p id="notificaciones-permitidas-texto" class="toast-body mb-0"></p>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>

    <div id="notificaciones-denegadas" class="toast bg-body shadow" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
      <div class="d-flex">
        <p id="notificaciones-denegadas-texto" class="toast-body mb-0"></p>
        <button type="button" class="btn-close  me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>

  </div>

  <!-- Modal para compartir cuando el navegador no soporta navigator.share.
       Lo completa y lo abre js/compartir.js. -->
  <div id="modal-compartir" class="modal fade" tabindex="-1" aria-labelledby="titulo-modal-compartir" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="titulo-modal-compartir" class="modal-title h5">Compartir lista</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          <label for="texto-modal-compartir" class="form-label mb-0">Texto a compartir</label>
          <textarea id="texto-modal-compartir" class="form-control" rows="7" readonly></textarea>
          <button type="button" id="boton-copiar-compartir" class="btn btn-primary" aria-live="polite">Copiar texto</button>
          <div class="d-flex flex-wrap gap-2" role="group" aria-label="Compartir en">
            <a id="enlace-whatsapp" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center gap-2" target="_blank" rel="noopener">
              <i class="bi bi-whatsapp" aria-hidden="true"></i> WhatsApp
            </a>
            <a id="enlace-facebook" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center gap-2" target="_blank" rel="noopener">
              <i class="bi bi-facebook" aria-hidden="true"></i> Facebook
            </a>
            <a id="enlace-instagram" href="https://www.instagram.com/direct/inbox/" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center gap-2" target="_blank" rel="noopener">
              <i class="bi bi-instagram" aria-hidden="true"></i> Instagram
            </a>
            <a id="enlace-correo" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-envelope" aria-hidden="true"></i> Correo
            </a>
          </div>
          <p class="small text-body-secondary mb-0">Instagram: el texto se copia para que lo pegues en el chat.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/iconos.js"></script>
  <script src="./js/claro-oscuro.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/compartir.js"></script>
</body>
</html>
