<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LISTAPP</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-body-tertiary">

  <div class="container-fluid p-3">
    <div class="row g-3 app-shell">

      <!-- ===== Banner: marca + navegación entre listas (Navbar en vertical) ===== -->
      <header class="col-12 col-lg-3">
        <nav class="navbar bg-body border rounded-3 h-100 p-3 p-lg-4 flex-column flex-nowrap align-items-stretch"
             aria-label="Navegación de listas">

          <h1 class="navbar-brand franja-encabezado fs-4 fw-bold w-100 mx-0 d-flex align-items-center justify-content-center border-bottom pb-3 mb-3">LISTAPP</h1>

          <!-- Título + selector propio de listas (independiente del de tareas). -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 id="titulo-mis-listas" class="small fw-semibold text-uppercase text-body-secondary mb-0">Mis Listas</h2>
            <button id="btn-seleccionar-listas" type="button"
                    class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1"
                    title="Seleccionar listas" aria-pressed="false">
              <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21C4.45 21 3.97917 20.8042 3.5875 20.4125C3.19583 20.0208 3 19.55 3 19V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H19C19.55 3 20.0208 3.19583 20.4125 3.5875C20.8042 3.97917 21 4.45 21 5V19C21 19.55 20.8042 20.0208 20.4125 20.4125C20.0208 20.8042 19.55 21 19 21H5ZM5 19H19V5H5V19Z"/></svg>
              Seleccionar
            </button>
          </div>

          <!-- Barra "Seleccionar todas / Eliminar": la arma js/app.js solo
               en modo "Seleccionar listas". -->
          <div id="barra-seleccion-listas" class="mb-2 d-none"></div>

          <!-- Las listas las inyecta js/app.js: cada una es un <li>.
               flex-grow-1 + overflow-y-auto -> ocupa el espacio libre y
               scrollea por dentro cuando hay muchas (el min-height: 0 va
               en styles.css). -->
          <ul id="listas-sidebar" class="list-group gap-2 w-100 flex-grow-1 overflow-y-auto"></ul>

          <!-- Crear lista: fuera del área que scrollea, siempre fijo al fondo.
               El mt-3 lo separa del list-group (ya no hace falta mt-auto:
               el flex-grow-1 de #listas-sidebar empuja este form abajo). -->
          <form id="form-nueva-lista" class="w-100 mt-3 d-flex flex-column gap-2">
            <label for="entrada-nueva-lista" class="form-label mb-0">Nombre de tu lista</label>
            <input type="text" id="entrada-nueva-lista" class="form-control" autocomplete="off">
            <!-- El texto del error lo pone js/app.js; Bootstrap lo muestra
                 solo cuando el input tiene la clase .is-invalid -->
            <p id="error-nueva-lista" class="invalid-feedback mb-0"></p>
            <button type="submit" id="btn-crear-lista" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
              <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21V13H3V11H11V3H13V11H21V13H13V21H11Z"/></svg>
              Crear Lista
            </button>
          </form>
        </nav>
      </header>

      <!-- ===== Panel principal: tareas de la lista activa ===== -->
      <main class="col-12 col-lg-9">
        <div class="p-3 p-lg-4">

          <!-- Encabezado -->
          <header class="franja-encabezado d-flex justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
            <!-- El título de la lista y la fecha los crea js/app.js -->
            <div id="encabezado-lista"></div>

            <!-- Controles de la app:-->
            <div class="d-flex flex-wrap gap-2" role="toolbar" aria-label="Controles de la aplicación">
              <button id="btn-seleccionar-tareas" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Seleccionar tareas" aria-pressed="false">
                <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21C4.45 21 3.97917 20.8042 3.5875 20.4125C3.19583 20.0208 3 19.55 3 19V5C3 4.45 3.19583 3.97917 3.5875 3.5875C3.97917 3.19583 4.45 3 5 3H19C19.55 3 20.0208 3.19583 20.4125 3.5875C20.8042 3.97917 21 4.45 21 5V19C21 19.55 20.8042 20.0208 20.4125 20.4125C20.0208 20.8042 19.55 21 19 21H5ZM5 19H19V5H5V19Z"/></svg>
                Seleccionar
              </button>
              <button id="btn-editar-listas" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Editar listas">
                <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19H6.425L16.2 9.225L14.775 7.8L5 17.575V19ZM3 21V16.75L16.2 3.575C16.4 3.39167 16.6208 3.25 16.8625 3.15C17.1042 3.05 17.3583 3 17.625 3C17.8917 3 18.15 3.05 18.4 3.15C18.65 3.25 18.8667 3.4 19.05 3.6L20.425 5C20.625 5.18333 20.7708 5.4 20.8625 5.65C20.9542 5.9 21 6.15 21 6.4C21 6.66667 20.9542 6.92083 20.8625 7.1625C20.7708 7.40417 20.625 7.625 20.425 7.825L7.25 21H3ZM15.475 8.525L14.775 7.8L16.2 9.225L15.475 8.525Z"/></svg>
                Editar
              </button>
              <button id="btn-tema" type="button"
                      class="btn btn-outline-secondary d-flex align-items-center gap-2"
                      title="Cambiar tema">
                <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
                <span id="texto-tema">Oscuro</span>
              </button>
            </div>
          </header>

          <!-- Sección de tareas: filtros, agregar tarea y la lista.
               js/app.js la oculta (d-none) cuando no hay ninguna lista. -->
          <section id="seccion-tareas" class="d-none">

            <!-- Filtros: componente Nav de Bootstrap (nav-pills).
                 nav-justified  -> las tres del mismo ancho.
                 flex-column flex-md-row -> mobile: una abajo de la otra;
                                            desktop (md+): en fila. -->
            <div class="bg-body border rounded-3 p-2 mb-4">
              <ul class="nav nav-pills nav-justified flex-column flex-md-row gap-2" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link tab active py-2 d-flex align-items-center justify-content-center gap-2"
                          type="button" data-filter="all" role="tab" aria-selected="true">
                    Todas <span id="count-all" class="badge rounded-pill text-bg-secondary">0</span>
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link tab py-2 d-flex align-items-center justify-content-center gap-2"
                          type="button" data-filter="pending" role="tab" aria-selected="false">
                    Pendientes <span id="count-pending" class="badge rounded-pill text-bg-secondary">0</span>
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link tab py-2 d-flex align-items-center justify-content-center gap-2"
                          type="button" data-filter="completed" role="tab" aria-selected="false">
                    Completadas <span id="count-completed" class="badge rounded-pill text-bg-secondary">0</span>
                  </button>
                </li>
              </ul>
            </div>

            <!-- El form de agregar tarea lo arma js/app.js acá dentro. -->
            <div id="contenedor-form-tarea">
              <h4 class="h5 fw-semibold mb-3">Tus tareas</h4>
            </div>

            <!-- Barra "Seleccionar todas / Eliminar" de tareas: la arma
                 js/app.js solo en modo "Seleccionar tareas". -->
            <div id="barra-seleccion-tareas" class="mb-3 d-none"></div>

            <!-- Las tareas las inyecta js/app.js -->
            <ul id="lista-tareas" class="list-group gap-2"></ul>
            <p id="estado-vacio" class="text-center text-body-secondary py-5 d-none">No hay tareas para mostrar.</p>
          </section>

          <!-- Estado sin listas: visible por defecto; js/app.js lo oculta
               (d-none) en cuanto existe al menos una lista -->
          <p id="estado-sin-listas" class="text-center text-body-secondary py-5">
            No tenés listas creadas aún...
          </p>

        </div>
      </main>

    </div>
  </div>

  <!-- Contenedor de avisos (toasts). El texto lo pone js/app.js.
       Ocupa todo el ancho de abajo y alinea los toasts: centrados en mobile
       (al alcance del pulgar) y a la derecha desde lg. Bootstrap le pone
       pointer-events: none, así que no bloquea los clics de la página. -->
  <div class="toast-container position-fixed bottom-0 start-0 w-100 p-3 d-flex flex-column align-items-center align-items-lg-end">
    <div id="toast-aviso" class="toast text-bg-secondary border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <p id="toast-aviso-texto" class="toast-body mb-0"></p>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>

    <!-- Toast de "tarea/lista eliminada" con opción de deshacer. Lo maneja js/app.js. -->
    <div id="toast-deshacer" class="toast bg-body shadow" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="5000">
      <div class="d-flex align-items-center gap-2 pe-2">
        <p id="toast-deshacer-texto" class="toast-body mb-0 flex-grow-1"></p>
        <button type="button" id="toast-deshacer-btn" class="btn btn-primary btn-sm fw-semibold">Deshacer</button>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/claro_oscuro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
